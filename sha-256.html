<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Security: Strict Content Security Policy (Offline Proof) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none';">

    <title>Validator v2.1 (Anti-Autofill Max)</title>
    <style>
        html { min-height: 100vh; border: 10px solid transparent; box-sizing: border-box; transition: border-color 0.3s; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; padding: 15px; background: #f0f4f8; margin: 0; display: flex; justify-content: center; }
        @keyframes warningPulse { 0% { border-color: #e63946; } 50% { border-color: #ff0000; } 100% { border-color: #e63946; } }
        .warning-active { animation: warningPulse 1.2s infinite; }
        .card { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 18px; color: #333; }
        .reset-btn { padding: 8px 14px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        input { width: 100%; padding: 14px; margin: 5px 0; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 18px; outline: none; }
        .check-row { display: flex; align-items: center; margin: 10px 0 15px; cursor: pointer; font-size: 14px; color: #666; }
        .check-row input { width: 18px; height: 18px; margin-right: 8px; }
        .label-text { font-weight: bold; font-size: 11px; color: #aaa; text-transform: uppercase; margin-top: 15px; display: block; }
        .result-container { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .result { background: #fdfdfd; padding: 0 15px; border-radius: 10px; border: 1px solid #eee; display: flex; align-items: center; height: 60px; flex-grow: 1; box-sizing: border-box; }
        .v-chars { color: #007bff; font-weight: bold; font-size: 30px; font-family: Verdana, sans-serif; letter-spacing: 2px; margin-right: 12px; }
        .mask { color: #ccc; letter-spacing: 4px; font-size: 16px; font-family: monospace; }
        .copy-btn { min-width: 100px; padding: 0 20px; background: #007bff; color: white; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; height: 60px; font-weight: bold; transition: background 0.2s; }
        .copy-btn:active { background: #0056b3; }
        .flash-ok { background: #d4edda !important; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h2>Validator</h2>
        <button id="resBtn" class="reset-btn" onclick="fullReset()">Reset All</button>
    </div>
    
    <input type="password" id="inp" 
           placeholder="Enter secret phrase..." 
           autocomplete="new-password" 
           data-bitwarden-ignore="true" 
           data-lpignore="true" 
           oninput="calc()">

    <label class="check-row">
        <input type="checkbox" id="shw" onclick="tgl()">
        <span>Show input phrase</span>
    </label>
    
    <span class="label-text">SHA-256:</span>
    <div class="result-container">
        <div id="v-sha256" class="result"><span class="mask">...</span></div>
        <button class="copy-btn" onclick="cp('sha256')">COPY</button>
    </div>

    <span class="label-text">SHA-1:</span>
    <div class="result-container">
        <div id="v-sha1" class="result"><span class="mask">...</span></div>
        <button class="copy-btn" onclick="cp('sha1')">COPY</button>
    </div>
</div>

<script>
    let _s = { s1: "", s256: "" };

    // Anti-Autofill Max: Рандомизируем имя поля при загрузке
    window.onload = () => {
        document.getElementById('inp').setAttribute('name', 'fld_' + Math.random().toString(36).substring(7));
    };

    async function calc() {
        const val = document.getElementById('inp').value;
        if (!val) { clear(); return; }
        
        const data = new TextEncoder().encode(val);
        const b256 = await crypto.subtle.digest('SHA-256', data);
        _s.s256 = toHex(b256);
        render('v-sha256', _s.s256);

        const b1 = await crypto.subtle.digest('SHA-1', data);
        _s.s1 = toHex(b1);
        render('v-sha1', _s.s1);
    }

    function render(id, hex) {
        const start = hex.substring(0, 3);
        document.getElementById(id).innerHTML = `<span class="v-chars">${start}</span><span class="mask">••••••••</span>`;
    }

    function toHex(buf) {
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function tgl() {
        document.getElementById('inp').type = document.getElementById('shw').checked ? "text" : "password";
    }

    function cp(type) {
        const key = type === 'sha1' ? _s.s1 : _s.s256;
        if (!key) return;
        
        navigator.clipboard.writeText(key).then(() => {
            const el = document.getElementById('v-' + type);
            el.classList.add('flash-ok');
            document.documentElement.classList.add('warning-active');
            setTimeout(() => el.classList.remove('flash-ok'), 500);
        });
    }

    function clear() {
        _s = { s1: "", s256: "" };
        document.getElementById('v-sha1').innerHTML = '<span class="mask">...</span>';
        document.getElementById('v-sha256').innerHTML = '<span class="mask">...</span>';
    }

    function fullReset() {
        const btn = document.getElementById('resBtn');
        const inp = document.getElementById('inp');
        inp.value = "";
        document.getElementById('shw').checked = false;
        inp.type = "password";
        clear();
        navigator.clipboard.writeText('');
        document.documentElement.classList.remove('warning-active');
        
        btn.innerText = "CLEARED";
        btn.style.background = "#28a745";
        setTimeout(() => {
            btn.innerText = "Reset All";
            btn.style.background = "#e63946";
            inp.focus();
        }, 700);
    }
</script>
</body>
</html>
